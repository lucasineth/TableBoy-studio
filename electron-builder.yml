appId: com.tableboy.studio
productName: TableBoy Studio
directories:
  buildResources: build
  output: dist/table-editor-${version}
extraResources:
  - from: build/icon.png
    to: icon.png
files:
  - out/**/*
  - package.json
win:
  executableName: TableBoyStudio
  icon: icon.ico
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
